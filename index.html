<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>冬季只見線之旅 ❄️</title>
    
    <link rel="manifest" href="manifest.json?v=18">
    <meta name="theme-color" content="#38bdf8">
    
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=只&background=38bdf8&color=ffffff&size=512&font-size=0.6&length=1">
    <link rel="icon" href="https://ui-avatars.com/api/?name=只&background=38bdf8&color=ffffff&size=64&font-size=0.6&length=1">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* 主程式樣式 */
        body { font-family: 'Zen Maru Gothic', sans-serif; background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 100%); color: #475569; overflow-x: hidden; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .snowflake { position: fixed; top: -10px; color: white; z-index: 0; animation: fall linear infinite; pointer-events: none; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.6); transition: all 0.3s; }
        .day-btn.active { background-color: #38bdf8; color: white; transform: scale(1.05); box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); }
        #loading-screen { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .img-container { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #e2e8f0; }
        .item-completed { opacity: 0.6; filter: grayscale(0.4); transform: scale(0.98); }
        .memo-link { color: #38bdf8; text-decoration: underline; font-weight: bold; }
        .action-btn { font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; height: 42px; }

        /* 通用導遊模式樣式 */
        #guide-overlay { font-family: 'Noto Sans TC', sans-serif; }
        .guide-fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 功能按鈕樣式 */
        .feature-btn {
            background: white; padding: 1.5rem; border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex; align-items: center; gap: 1rem; transition: all 0.2s;
            border: 1px solid #f3f4f6; width: 100%; text-align: left;
        }
        .feature-btn:active { transform: scale(0.98); background-color: #fafafa; }
        .feature-icon {
            width: 3.5rem; height: 3.5rem; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; flex-shrink: 0;
        }
        
        /* 新增：主題色文字 class，讓 JS 動態控制 */
        .theme-text { color: var(--guide-color, #4b5563); }
        .theme-bg-light { background-color: var(--guide-color); opacity: 0.1; }
    </style>
</head>
<body class="pb-24">

    <div id="loading-screen">
        <div class="text-sky-400 text-6xl mb-4 animate-spin"><i class="fas fa-snowflake"></i></div>
        <p id="loading-text" class="text-sky-500 font-bold">同步資料中...</p>
    </div>

    <div id="snow-container"></div>

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 px-6 py-4 rounded-b-[2rem] shadow-sm border-b border-blue-50">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-black text-sky-500 tracking-wider">冬季只見線之旅 ☃️</h1>
            <div class="bg-blue-50 text-sky-400 w-10 h-10 rounded-full flex items-center justify-center shadow-inner overflow-hidden">
                <img src="https://ui-avatars.com/api/?name=只&background=38bdf8&color=ffffff&size=128&font-size=0.6&length=1" class="w-full h-full object-cover">
            </div>
        </div>
    </header>

    <main id="app-content">
        <section id="tab-schedule" class="tab-content">
            <nav id="day-tabs" class="flex overflow-x-auto p-4 gap-3 sticky top-[85px] z-30 hide-scroll"></nav>
            <div id="schedule-container" class="px-4 pb-4 space-y-5"></div>
        </section>

        <section id="tab-expenses" class="tab-content hidden px-5 py-6">
            <div class="bg-gradient-to-r from-sky-400 to-blue-400 rounded-[2rem] p-6 shadow-lg text-white text-center mb-8">
                <p class="text-blue-100 text-sm font-bold mb-1">公積金預算</p>
                <h2 id="total-expense" class="text-4xl font-black">¥ 0</h2>
            </div>
        </section>
    </main>

    <div id="memo-modal" class="fixed inset-0 bg-slate-900/40 z-[100] hidden items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 relative">
            <h3 id="modal-title" class="text-2xl font-black text-slate-700 mb-4 border-b pb-2"></h3>
            <div id="modal-memo-content" class="bg-slate-50 rounded-2xl p-4 text-sm text-slate-600 leading-7 max-h-60 overflow-y-auto"></div>
            <button onclick="closeMemo()" class="mt-6 w-full bg-slate-800 text-white py-4 rounded-2xl font-bold action-btn text-lg">關閉</button>
        </div>
    </div>

    <footer class="fixed bottom-6 left-6 right-6 h-16 bg-white/90 backdrop-blur-md rounded-full shadow-2xl flex justify-around items-center z-40 border border-white/50">
        <button onclick="switchTab('schedule')" id="btn-schedule" class="text-sky-400"><i class="fas fa-map text-xl"></i></button>
        <button onclick="switchTab('expenses')" id="btn-expenses" class="text-slate-300"><i class="fas fa-yen-sign text-xl"></i></button>
    </footer>

    <div id="guide-overlay" class="fixed inset-0 bg-white z-[200] hidden flex-col overflow-hidden">
        
        <header class="bg-white/90 backdrop-blur shadow-sm p-4 flex justify-between items-center z-10 shrink-0 border-b">
            <div>
                <h1 id="guide-top-title" class="text-lg font-bold transition-colors duration-300">🏮 私人導遊</h1>
            </div>
            <button onclick="guideApp.close()" class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 font-bold hover:bg-gray-200 transition">
                <i class="fas fa-times"></i>
            </button>
        </header>

        <main id="guide-scroll-container" class="flex-1 overflow-y-auto bg-[#f8fafc] pb-20">
            
            <div class="relative h-80 w-full">
                <div id="guide-hero-img-container" class="w-full h-full bg-gray-200"></div>
                <div class="absolute inset-0 bg-black/40 flex items-center justify-center p-6 text-white text-center">
                    <h2 id="guide-hero-title" class="text-4xl md:text-5xl font-black drop-shadow-lg tracking-widest leading-tight"></h2>
                </div>
            </div>

            <div class="p-5 space-y-4 max-w-xl mx-auto mt-6">
                
                <button onclick="guideApp.showStaticModal('culture')" class="feature-btn">
                    <div class="feature-icon bg-orange-100 text-orange-600">🏯</div>
                    <div class="flex-1">
                        <h3 class="font-bold text-gray-800 text-lg">文化與歷史解說</h3>
                        <p class="text-xs text-gray-400">了解這裡的故事與淵源</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </button>

                <button onclick="guideApp.showStaticModal('food')" class="feature-btn">
                    <div class="feature-icon bg-red-100 text-red-600">🍜</div>
                    <div class="flex-1">
                        <h3 class="font-bold text-gray-800 text-lg">當地美食</h3>
                        <p class="text-xs text-gray-400">探索必吃的美味料理</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </button>

                <button onclick="guideApp.openExternalGemini()" class="feature-btn">
                    <div class="feature-icon bg-indigo-100 text-indigo-600">✨</div>
                    <div class="flex-1">
                        <h3 class="font-bold text-gray-800 text-lg">旅遊管家</h3>
                        <p class="text-xs text-gray-400">點擊前往 Gemini 詢問更多</p>
                    </div>
                    <i class="fas fa-external-link-alt text-gray-300"></i>
                </button>

                <div class="text-center text-xs text-gray-400 pt-4">Powered by Gemini (External) ✨</div>
            </div>
        </main>
    </div>

    <div id="static-modal" onclick="if(event.target === this) guideApp.closeModal('static-modal')" class="fixed inset-0 bg-black bg-opacity-60 hidden z-[250] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-[95%] max-w-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-[fadeIn_0.2s_ease-out]">
            <div class="flex justify-between items-center p-5 border-b bg-gray-50">
                <h3 id="static-modal-title" class="font-black text-2xl tracking-wide transition-colors duration-300">導覽資訊</h3>
                <button id="static-modal-close-btn" onclick="guideApp.closeModal('static-modal')" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 font-bold text-lg transition border border-transparent">&times;</button>
            </div>
            <div id="static-modal-body" class="p-6 overflow-y-auto text-lg leading-loose text-gray-700 whitespace-pre-wrap font-medium"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. Guide Database (現在只存文字資料)
        // ==========================================
        const guideDatabase = {};

        // ==========================================
        // 2. Guide App Logic (無 API 版)
        // ==========================================
        
        const guideApp = {
            state: { currentTitle: null }, 

            // 開啟私人導遊頁面
            open: function(title) {
                const data = guideDatabase[title];
                
                if (!data) { 
                    alert("⚠️ 尚未建立此景點的導覽資料。\n請在 Google 試算表 'guideData' 分頁新增一筆，A欄填寫: " + title); 
                    return; 
                }
                this.state.currentTitle = title;
                
                // 設定主題色
                const themeColor = data.themeColor || '#4b5563';
                document.documentElement.style.setProperty('--guide-color', themeColor);
                
                // 應用顏色到 UI
                document.getElementById('guide-top-title').innerText = "🏮 " + data.title;
                document.getElementById('guide-top-title').style.color = themeColor; // 標題變色
                
                document.getElementById('guide-hero-title').innerText = data.title;
                
                // 設定大圖
                const imgContainer = document.getElementById('guide-hero-img-container');
                const imgUrl = data.heroImg || "https://placehold.co/600x400?text=No+Image";
                imgContainer.innerHTML = `<img src="${imgUrl}" referrerpolicy="no-referrer" class="w-full h-full object-cover">`;

                const overlay = document.getElementById('guide-overlay');
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            },

            close: function() {
                document.getElementById('guide-overlay').classList.add('hidden');
                document.getElementById('guide-overlay').classList.remove('flex');
            },

            // 顯示靜態資料 Modal
            showStaticModal: function(type) {
                const data = guideDatabase[this.state.currentTitle];
                const modal = document.getElementById('static-modal');
                const body = document.getElementById('static-modal-body');
                const title = document.getElementById('static-modal-title');
                const closeBtn = document.getElementById('static-modal-close-btn');

                // 應用顏色到 Modal
                const themeColor = data.themeColor || '#4b5563';
                title.style.color = themeColor;
                closeBtn.style.color = themeColor;
                closeBtn.style.borderColor = themeColor + '30'; // 淡淡的邊框
                
                let contentHTML = "";

                if (type === 'culture') {
                    title.innerText = "🏯 文化與歷史解說";
                    const rawText = data.cultureText || "尚無此部分的介紹資料。";
                    contentHTML = `<div class="space-y-4">${rawText.split('\n').map(p => `<p>${p}</p>`).join('')}</div>`;

                } else if (type === 'food') {
                    title.innerText = "🍜 當地美食介紹";
                    const rawText = data.foodText || "尚無此部分的介紹資料。";
                    
                    if (rawText.includes("||")) {
                        const items = rawText.split("||");
                        let listHtml = '<div class="space-y-6">'; 
                        items.forEach(item => {
                            const parts = item.split(":::");
                            const foodName = parts[0] ? parts[0].trim() : "";
                            const foodDesc = parts[1] ? parts[1].trim() : "";
                            
                            if(foodName) {
                                // 讓菜名也套用主題色，但稍微深一點或直接用主題色
                                listHtml += `
                                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 shadow-sm">
                                        <h4 class="font-bold text-xl mb-2 flex items-center gap-2" style="color:${themeColor}">
                                            <i class="fas fa-utensils text-sm"></i> ${foodName}
                                        </h4>
                                        <p class="text-gray-600 leading-relaxed text-base">${foodDesc}</p>
                                    </div>`;
                            }
                        });
                        listHtml += '</div>';
                        contentHTML = listHtml;
                    } else {
                        contentHTML = rawText;
                    }
                }

                body.innerHTML = contentHTML; 
                modal.classList.remove('hidden');
            },

            openExternalGemini: function() {
                window.open("https://gemini.google.com/app", "_blank");
            },

            closeModal: function(modalId) {
                document.getElementById(modalId).classList.add('hidden');
            }
        };

        // ==========================================
        // 3. Main App Logic
        // ==========================================
        const apiUrl = "https://script.google.com/macros/s/AKfycbxPtv0rhx9LHpryrcJ4LrxZk7wyIaFOMhoNrPymG7mlbEZJ3oHtNHTp2TuPR1teXD4eUg/exec";
        
        let travelData = {};
        let progress = JSON.parse(localStorage.getItem('trip_progress')) || {};

        function linkify(text) {
            if (!text) return "";
            let processed = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" class="memo-link">$1</a>');
            const urlRegex = /(?<!href="|">)(https?:\/\/[^\s<]+)/g;
            return processed.replace(urlRegex, '<a href="$1" target="_blank" class="memo-link">$1</a>');
        }

        function formatMultiLines(text) {
            if (!text || text === "undefined") return '尚無筆記';
            const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            return lines.length <= 1 ? linkify(text) : `<ol class="list-decimal ml-5 space-y-2">${lines.map(l => `<li>${linkify(l)}</li>`).join('')}</ol>`;
        }

        function openGoApp() {
            window.location.href = "jp.go.taxiapp://";
            setTimeout(() => { window.location.href = "https://go.mo-t.com/"; }, 1500);
        }

        async function fetchTravelData() {
            try {
                const res = await fetch(apiUrl + "?t=" + Date.now());
                if (!res.ok) throw new Error("Network response was not ok");
                
                const rawData = await res.json();
                
                if (rawData.error) throw new Error(rawData.error);

                travelData = rawData; 

                if (rawData.guides) {
                    console.log("成功載入導遊資料:", Object.keys(rawData.guides));
                    Object.assign(guideDatabase, rawData.guides);
                }

                document.getElementById('loading-screen').style.display = 'none';
                renderSchedule();
                createSnow();
            } catch (e) {
                console.error("同步錯誤:", e);
                document.getElementById('loading-text').innerHTML = "同步失敗<br><span style='font-size:12px;opacity:0.8'>請檢查 GAS 網址或資料結構</span>";
            }
        }

        function renderSchedule() {
            if (!travelData.days) return;
            const tabs = document.getElementById('day-tabs');
            const container = document.getElementById('schedule-container');
            tabs.innerHTML = ''; container.innerHTML = '';

            travelData.days.forEach((d, dayIdx) => {
                const btn = document.createElement('button');
                btn.className = `day-btn flex-shrink-0 px-6 py-2 rounded-[1.5rem] flex flex-col items-center bg-white text-slate-400 border border-slate-100 ${dayIdx === 0 ? 'active' : ''}`;
                btn.innerHTML = `<span class="text-sm font-bold opacity-70">Day ${d.day}</span><span class="text-sm font-black">${d.date}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    showDay(d.day);
                };
                tabs.appendChild(btn);

                const div = document.createElement('div');
                div.id = `day-sec-${d.day}`;
                div.className = `day-section ${dayIdx === 0 ? '' : 'hidden'}`;
                
                let html = '';
                d.items.forEach((item, itemIdx) => {
                    const itemId = `d${d.day}i${itemIdx}`;
                    const isDone = progress[itemId];
                    const hasGuide = guideDatabase[item.title] !== undefined;
                    const imgHtml = `<img src="${item.img}" referrerpolicy="no-referrer" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1483921020237-2ff51e8e4b22?w=800'">`;
                    
                    const descHtml = item.desc ? `
                        <div class="absolute bottom-3 left-3 bg-black/60 text-white px-3 py-1 rounded-lg text-xs font-bold backdrop-blur-sm max-w-[75%] truncate shadow-md">
                            ${item.desc}
                        </div>
                    ` : '';

                    html += `
                        <div class="glass-card rounded-[2rem] overflow-hidden mb-5 shadow-sm ${isDone ? 'item-completed' : ''}">
                            <div class="img-container">
                                ${imgHtml}
                                <div class="absolute top-3 left-3 bg-white/90 px-4 py-1.5 rounded-full text-sm font-black text-sky-500 shadow-sm">
                                    <i class="far fa-clock mr-1"></i>${item.time}
                                </div>
                                ${descHtml}
                                <button onclick="toggleProgress('${itemId}')" class="absolute top-3 right-3 w-10 h-10 rounded-full bg-white/90 shadow-sm flex items-center justify-center">
                                    ${isDone ? '✅' : '○'}
                                </button>
                            </div>
                            <div class="p-5">
                                <h3 class="font-black text-lg text-slate-700 mb-3">${item.title}</h3>
                                
                                <div class="grid grid-cols-2 gap-3 mb-3">
                                    ${ hasGuide ? 
                                    `<button onclick="guideApp.open('${item.title.replace(/'/g, "\\'")}')" class="action-btn bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-xl shadow-md active:scale-95 transition">
                                        <i class="fas fa-user-tie mr-2"></i>私人導遊
                                    </button>` : 
                                    `<button disabled class="action-btn bg-slate-100 text-slate-300 rounded-xl cursor-not-allowed">
                                        無導覽
                                    </button>`
                                    }
                                    <button onclick="openMemoByIndex(${dayIdx}, ${itemIdx})" class="action-btn bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200">
                                        查看筆記
                                    </button>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <button onclick="openGoApp()" class="action-btn bg-black text-white rounded-xl">
                                        GO 叫車
                                    </button>
                                    <a href="${item.map}" target="_blank" class="action-btn bg-sky-400 text-white rounded-xl shadow-sm hover:bg-sky-500">
                                        開啟導航
                                    </a>
                                </div>
                            </div>
                        </div>`;
                });
                div.innerHTML = html;
                container.appendChild(div);
            });
        }

        function openMemoByIndex(dayIdx, itemIdx) {
            const item = travelData.days[dayIdx].items[itemIdx];
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-memo-content').innerHTML = formatMultiLines(item.memo);
            document.getElementById('memo-modal').classList.replace('hidden', 'flex');
        }

        function showDay(d) {
            document.querySelectorAll('.day-section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`day-sec-${d}`).classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'auto' });
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById('btn-schedule').className = tab === 'schedule' ? 'text-sky-400' : 'text-slate-300';
            document.getElementById('btn-expenses').className = tab === 'expenses' ? 'text-sky-400' : 'text-slate-300';
        }

        function closeMemo() { 
            document.getElementById('memo-modal').classList.replace('flex', 'hidden'); 
        }

        function createSnow() {
            const container = document.getElementById('snow-container');
            for (let i = 0; i < 20; i++) {
                const snow = document.createElement('div');
                snow.innerHTML = '❄'; snow.className = 'snowflake';
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.animationDuration = Math.random() * 3 + 2 + 's';
                container.appendChild(snow);
            }
        }

        function toggleProgress(itemId) {
            progress[itemId] = !progress[itemId];
            localStorage.setItem('trip_progress', JSON.stringify(progress));
            renderSchedule();
        }

        window.onload = () => fetchTravelData();
    </script>
</body>
</html>
