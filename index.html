<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>冬季只見線之旅 ❄️</title>
    
    <link rel="manifest" href="manifest.json?v=17">
    <meta name="theme-color" content="#38bdf8">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2334/2334855.png?v=17">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* 主程式樣式 */
        body { font-family: 'Zen Maru Gothic', sans-serif; background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 100%); color: #475569; overflow-x: hidden; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .snowflake { position: fixed; top: -10px; color: white; z-index: 0; animation: fall linear infinite; pointer-events: none; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.6); transition: all 0.3s; }
        .day-btn.active { background-color: #38bdf8; color: white; transform: scale(1.05); box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); }
        #loading-screen { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .img-container { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #e2e8f0; }
        .item-completed { opacity: 0.6; filter: grayscale(0.4); transform: scale(0.98); }
        .memo-link { color: #38bdf8; text-decoration: underline; font-weight: bold; }
        .action-btn { font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; height: 42px; }

        /* 通用導遊模式樣式 */
        #guide-overlay { font-family: 'Noto Sans TC', sans-serif; }
        .guide-fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-item.active { background-color: #f3f4f6; border-right: 4px solid var(--guide-color, #8c7b75); font-weight: bold; color: var(--guide-color, #8c7b75); }
        .spinner {
            border: 3px solid rgba(140, 123, 117, 0.3); border-radius: 50%; border-top: 3px solid var(--guide-color, #8c7b75);
            width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .img-box {
            background: #eee; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            color: #888; font-size: 0.9rem; overflow: hidden; border: 1px solid #ddd;
            font-weight: bold; background-color: #f3f4f6; text-align: center;
        }
        /* 動態主題色變數 */
        :root { --guide-color: #8c7b75; }
    </style>
</head>
<body class="pb-24">

    <div id="loading-screen">
        <div class="text-sky-400 text-6xl mb-4 animate-spin"><i class="fas fa-snowflake"></i></div>
        <p id="loading-text" class="text-sky-500 font-bold">同步資料中...</p>
    </div>

    <div id="snow-container"></div>

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 px-6 py-4 rounded-b-[2rem] shadow-sm border-b border-blue-50">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-black text-sky-500 tracking-wider">冬季只見線之旅 ☃️</h1>
            <div class="bg-blue-50 text-sky-400 w-10 h-10 rounded-full flex items-center justify-center shadow-inner overflow-hidden">
                <img src="https://cdn-icons-png.flaticon.com/512/2334/2334855.png" class="w-7 h-7 object-contain">
            </div>
        </div>
    </header>

    <main id="app-content">
        <section id="tab-schedule" class="tab-content">
            <nav id="day-tabs" class="flex overflow-x-auto p-4 gap-3 sticky top-[85px] z-30 hide-scroll"></nav>
            <div id="schedule-container" class="px-4 pb-4 space-y-5"></div>
        </section>

        <section id="tab-expenses" class="tab-content hidden px-5 py-6">
            <div class="bg-gradient-to-r from-sky-400 to-blue-400 rounded-[2rem] p-6 shadow-lg text-white text-center mb-8">
                <p class="text-blue-100 text-sm font-bold mb-1">公積金預算</p>
                <h2 id="total-expense" class="text-4xl font-black">¥ 0</h2>
            </div>
        </section>
    </main>

    <div id="memo-modal" class="fixed inset-0 bg-slate-900/40 z-[100] hidden items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 relative">
            <h3 id="modal-title" class="text-2xl font-black text-slate-700 mb-4 border-b pb-2"></h3>
            <div id="modal-memo-content" class="bg-slate-50 rounded-2xl p-4 text-sm text-slate-600 leading-7 max-h-60 overflow-y-auto"></div>
            <button onclick="closeMemo()" class="mt-6 w-full bg-slate-800 text-white py-4 rounded-2xl font-bold action-btn text-lg">關閉</button>
        </div>
    </div>

    <footer class="fixed bottom-6 left-6 right-6 h-16 bg-white/90 backdrop-blur-md rounded-full shadow-2xl flex justify-around items-center z-40 border border-white/50">
        <button onclick="switchTab('schedule')" id="btn-schedule" class="text-sky-400"><i class="fas fa-map text-xl"></i></button>
        <button onclick="switchTab('expenses')" id="btn-expenses" class="text-slate-300"><i class="fas fa-yen-sign text-xl"></i></button>
    </footer>

    <div id="guide-overlay" class="fixed inset-0 bg-[#fdfbf7] z-[200] hidden flex-col md:flex-row overflow-hidden">
        
        <header class="md:hidden bg-white shadow-sm p-4 flex justify-between items-center z-10 shrink-0">
            <h1 id="m-guide-title" class="text-xl font-bold text-gray-800">🏮 私人導遊</h1>
            <button onclick="guideApp.close()" class="text-gray-500 font-bold border border-gray-300 px-3 py-1 rounded-lg text-sm">
                <i class="fas fa-times mr-1"></i>結束
            </button>
        </header>

        <nav id="guide-sidebar" class="bg-white border-r border-gray-200 w-full md:w-64 flex-shrink-0 absolute md:relative transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-20 h-full flex flex-col justify-between pt-14 md:pt-0">
            <div>
                <div class="p-6 hidden md:block">
                    <h1 id="d-guide-title" class="text-2xl font-bold text-gray-800 tracking-wide">導覽標題</h1>
                    <span id="d-guide-subtitle" class="text-base font-normal text-gray-500">副標題</span>
                </div>
                <ul class="mt-4 md:mt-0 space-y-1">
                    <li><button onclick="guideApp.navigate('overview')" class="nav-item active w-full text-left px-6 py-4 hover:bg-gray-50 transition-colors flex items-center gap-3"><span>🏯</span><span>景點與文化</span></button></li>
                    <li><button onclick="guideApp.navigate('food')" class="nav-item w-full text-left px-6 py-4 hover:bg-gray-50 transition-colors flex items-center gap-3"><span>🥢</span><span>道地美食</span></button></li>
                    <li><button onclick="guideApp.navigate('ai-concierge')" class="nav-item w-full text-left px-6 py-4 hover:bg-indigo-50 transition-colors flex items-center gap-3 text-indigo-700 font-bold"><span>✨</span><span>旅遊管家</span></button></li>
                </ul>
            </div>
            <div class="p-6 border-t border-gray-100 text-xs text-gray-400">
                <button onclick="guideApp.close()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold mb-4 md:hidden">結束導覽</button>
                <button onclick="guideApp.close()" class="hidden md:block w-full border border-slate-300 text-slate-600 py-2 rounded-lg font-bold mb-4 hover:bg-slate-100">返回主行程</button>
                <p>Powered by Gemini ✨</p>
            </div>
        </nav>

        <main class="flex-1 overflow-y-auto relative bg-[#fdfbf7] p-4 md:p-8 pb-24" id="guide-main-content"></main>

        <button id="guide-menu-btn" onclick="guideApp.toggleMenu()" class="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-indigo-600 text-white rounded-full shadow-2xl flex items-center justify-center z-30 text-2xl">
            <i class="fas fa-bars"></i>
        </button>

        <div id="ai-modal" onclick="if(event.target === this) guideApp.closeModal()" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl relative overflow-hidden">
                <div class="flex justify-between items-center p-4 border-b bg-white z-10 shrink-0">
                    <h3 id="ai-modal-title" class="text-xl font-bold text-indigo-700">✨ 旅遊管家建議</h3>
                    <button onclick="guideApp.closeModal()" class="text-gray-400 hover:text-gray-600 text-3xl w-10 h-10 flex items-center justify-center bg-gray-100 rounded-full transition">&times;</button>
                </div>
                <div id="ai-modal-body" class="p-6 overflow-y-auto text-gray-700 leading-relaxed whitespace-pre-wrap overscroll-contain"></div>
                <div class="p-4 border-t bg-gray-50 shrink-0 flex justify-end">
                    <button onclick="guideApp.closeModal()" class="w-full md:w-auto bg-slate-800 text-white px-6 py-3 rounded-xl font-bold hover:bg-slate-700 transition">關閉視窗</button>
                </div>
            </div>
        </div>

        <div id="guide-overlay-bg" class="fixed inset-0 bg-black bg-opacity-50 hidden z-10 md:hidden" onclick="guideApp.toggleMenu()"></div>
    </div>


    <script>
        // ==========================================
        // 1. Guide Database
        // ==========================================
        const guideDatabase = {};

        // ==========================================
        // 2. Guide App Logic
        // ==========================================
        
        // ⚠️ API Key
        const apiKey = "AIzaSyCsTckKweWtDj0g88fEiI32UFuBiAsRmWM"; 

        const guideApp = {
            state: { currentId: null, currentView: 'overview' },

            open: function(guideId) {
                const data = guideDatabase[guideId];
                if (!data) { 
                    alert("⚠️ 錯誤：找不到 ID 為 [" + guideId + "] 的導覽資料。\n\n請檢查：\n1. Google 試算表 'guideData' 分頁是否已填寫正確的 guideId。\n2. 是否已在 GAS 部署為『新版本』。"); 
                    return; 
                }
                this.state.currentId = guideId;
                document.getElementById('d-guide-title').innerText = "🏮 " + data.title;
                document.getElementById('d-guide-subtitle').innerText = data.subTitle;
                document.getElementById('m-guide-title').innerText = "🏮 " + data.title;
                document.documentElement.style.setProperty('--guide-color', data.themeColor);
                const overlay = document.getElementById('guide-overlay');
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
                this.navigate('overview');
            },

            close: function() {
                const overlay = document.getElementById('guide-overlay');
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            },

            toggleMenu: function() {
                const sidebar = document.getElementById('guide-sidebar');
                const overlay = document.getElementById('guide-overlay-bg');
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            },

            navigate: function(viewName) {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const navItems = document.querySelectorAll('.nav-item');
                // 修正對應表：已移除 tips
                const mapping = { 'overview': 0, 'food': 1, 'ai-concierge': 2 };
                if(navItems[mapping[viewName]]) navItems[mapping[viewName]].classList.add('active');
                
                this.state.currentView = viewName;
                this.renderView(viewName);
                
                if (window.innerWidth < 768) {
                    const sidebar = document.getElementById('guide-sidebar');
                    if(!sidebar.classList.contains('-translate-x-full')) this.toggleMenu();
                }
            },

            renderView: function(viewName) {
                const main = document.getElementById('guide-main-content');
                const data = guideDatabase[this.state.currentId]; 
                main.innerHTML = '';
                if (viewName === 'overview') this.renderOverview(main, data);
                else if (viewName === 'food') this.renderFood(main, data);
                // 已移除 tips 頁面渲染
                else if (viewName === 'ai-concierge') this.renderAIConcierge(main, data);
            },

            renderOverview: function(container, data) {
                const info = data.overview;
                const culturePrompt = `請詳細導覽「${data.title}」的背景故事與文化特色，並說明為什麼這裡值得一遊。`;
                const historyPrompt = `請專注介紹「${data.title}」的歷史淵源、過去發生的重要事件，以及這些歷史如何影響現在的樣貌。`;
                const btnClass = "bg-white p-5 rounded-xl shadow-md border border-gray-100 flex items-center justify-between hover:bg-indigo-50 active:scale-95 transition group w-full";

                container.innerHTML = `
                    <div class="guide-fade-in max-w-5xl mx-auto">
                        <h2 class="text-3xl font-bold mb-4 text-gray-800 border-b-2 border-[var(--guide-color)] pb-2 inline-block">${info.title || data.title}</h2>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mt-6">
                            <div class="space-y-6">
                                <p class="text-lg text-gray-600 leading-relaxed">${info.desc}</p>
                                <div class="img-box h-64 shadow-inner font-bold text-gray-400 bg-gray-100">
                                    <img src="${info.img}" referrerpolicy="no-referrer" class="w-full h-full object-cover" onerror="this.onerror=null;this.src='https://placehold.co/600x400?text=No+Image'">
                                </div>
                            </div>
                            <div class="space-y-4">
                                <h3 class="text-xl font-bold text-gray-700 mb-2 flex items-center gap-2">
                                    <i class="fas fa-info-circle text-indigo-500"></i> 深度導覽
                                </h3>
                                <button onclick="guideApp.callGemini('${culturePrompt}', '文化解說')" class="${btnClass}">
                                    <div class="flex items-center gap-4">
                                        <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center text-2xl">✨</div>
                                        <div class="text-left">
                                            <div class="font-bold text-lg text-gray-800 group-hover:text-indigo-700">文化解說</div>
                                            <div class="text-sm text-gray-500">了解這裡的背景故事</div>
                                        </div>
                                    </div>
                                    <i class="fas fa-chevron-right text-gray-300 group-hover:text-indigo-500"></i>
                                </button>
                                <button onclick="guideApp.callGemini('${historyPrompt}', '歷史景點')" class="${btnClass}">
                                    <div class="flex items-center gap-4">
                                        <div class="w-12 h-12 rounded-full bg-orange-100 flex items-center justify-center text-2xl">🏯</div>
                                        <div class="text-left">
                                            <div class="font-bold text-lg text-gray-800 group-hover:text-orange-700">歷史景點</div>
                                            <div class="text-sm text-gray-500">探索過去的歷史淵源</div>
                                        </div>
                                    </div>
                                    <i class="fas fa-chevron-right text-gray-300 group-hover:text-orange-500"></i>
                                </button>
                            </div>
                        </div>
                    </div>`;
            },

            renderFood: function(container, data) {
                const info = data.food;
                const items = info.items || [];
                
                const foodCards = items.map(item => {
                    const foodPrompt = `請介紹「${data.title}」的特色美食：「${item.name}」。包含它的由來、口感與推薦吃法。`;
                    
                    let imgHtml = item.img;
                    if (item.img.startsWith('http')) {
                        imgHtml = `<img src="${item.img}" referrerpolicy="no-referrer" class="w-full h-full object-cover" onerror="this.onerror=null;this.src='https://placehold.co/600x400?text=Food'">`;
                    }

                    return `
                    <div class="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col">
                        <div class="img-box h-56 w-full text-6xl flex items-center justify-center bg-gray-100">
                            ${imgHtml}
                        </div>
                        <div class="p-6">
                            <h3 class="text-2xl font-bold text-[var(--guide-color)] mb-2">${item.name}</h3>
                            <p class="text-gray-600 leading-relaxed">${item.desc}</p>
                            <button onclick="guideApp.callGemini('${foodPrompt}', '${item.name}')" class="mt-4 text-indigo-600 text-sm font-bold flex items-center gap-1 hover:underline">
                                ✨ 聽聽旅遊管家怎麼說
                            </button>
                        </div>
                    </div>
                `}).join('');

                container.innerHTML = `
                    <div class="guide-fade-in max-w-5xl mx-auto">
                        <h2 class="text-3xl font-bold mb-4 text-gray-800 border-b-2 border-[var(--guide-color)] pb-2 inline-block">${info.title || "特色美食"}</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-10 mt-8">
                            ${foodCards}
                        </div>
                    </div>`;
            },

            renderAIConcierge: function(container, data) {
                container.innerHTML = `
                    <div class="guide-fade-in max-w-5xl mx-auto h-full flex flex-col">
                        <h2 class="text-3xl font-bold mb-4 text-indigo-700 border-b-2 border-indigo-200 pb-2 inline-block">✨ 旅遊管家</h2>
                        <div class="flex-1 flex flex-col bg-white rounded-xl shadow-lg border border-indigo-100 overflow-hidden mt-4" style="min-height: 400px;">
                            <div id="chat-history" class="flex-1 p-6 overflow-y-auto space-y-4 bg-gray-50">
                                <div class="bg-indigo-100 p-3 rounded-lg max-w-[80%] text-indigo-800">
                                    您好！我是您的${data.title}專屬旅遊管家。任何關於這裡的歷史、交通或美食問題都可以問我！
                                </div>
                            </div>
                            <div class="p-4 border-t flex gap-2">
                                <input id="chat-input" type="text" placeholder="輸入問題..." class="flex-1 border-2 border-indigo-100 focus:border-indigo-400 p-3 rounded-xl outline-none">
                                <button onclick="guideApp.handleChat()" class="bg-indigo-600 text-white px-6 py-3 rounded-xl hover:bg-indigo-700">✨ 送出</button>
                            </div>
                        </div>
                    </div>`;
            },

            callGemini: async function(promptText, modalTitle) {
                const modal = document.getElementById('ai-modal');
                const body = document.getElementById('ai-modal-body');
                const title = document.getElementById('ai-modal-title');
                
                title.innerText = "✨ 旅遊管家：" + modalTitle;
                modal.classList.remove('hidden');
                body.innerHTML = '<div class="text-center p-8"><div class="spinner mr-2"></div> 旅遊管家正在思考中...</div>';

                try {
                    const currentData = guideDatabase[this.state.currentId];
                    const systemPrompt = currentData.aiPersona || "你是一位貼心的旅遊隨行管家，請用親切、易懂的繁體中文為我們全家人介紹景點與美食。";
                    const response = await this.fetchGemini(promptText, systemPrompt);
                    body.innerHTML = response;
                } catch (error) {
                    body.innerHTML = `<div class="text-red-500">抱歉，旅遊管家暫時無法回應。請檢查網路或 API Key。</div>`;
                }
            },

            closeModal: function() { document.getElementById('ai-modal').classList.add('hidden'); },

            handleChat: async function() {
                const input = document.getElementById('chat-input');
                const history = document.getElementById('chat-history');
                const text = input.value.trim();
                if (!text) return;

                history.innerHTML += `<div class="bg-white p-3 rounded-lg max-w-[80%] ml-auto text-gray-800 shadow-sm border">${text}</div>`;
                input.value = "";
                history.scrollTop = history.scrollHeight;

                const loadingId = 'ai-loading-' + Date.now();
                history.innerHTML += `<div id="${loadingId}" class="bg-indigo-100 p-3 rounded-lg max-w-[80%] text-indigo-800"><div class="spinner"></div></div>`;
                history.scrollTop = history.scrollHeight;

                try {
                    const currentData = guideDatabase[this.state.currentId];
                    const systemPrompt = currentData.aiPersona || "你是一位貼心的旅遊隨行管家，請用親切、易懂的繁體中文為我們全家人介紹景點與美食。";
                    const response = await this.fetchGemini(text, systemPrompt);
                    document.getElementById(loadingId).innerText = response;
                } catch (error) {
                    document.getElementById(loadingId).innerText = "旅遊管家忙線中 (請檢查 API Key)";
                }
                history.scrollTop = history.scrollHeight;
            },

            fetchGemini: async function(userPrompt, systemPrompt) {
                if (!apiKey) return "請在程式碼中填入 Gemini API Key。";
                
                let retries = 3;
                const payload = {
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                while (retries > 0) {
                    try {
                        // 修正：使用 gemini-1.5-flash 穩定版模型，解決 Busy 問題
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error('API Error');
                        const data = await response.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text || "No content";
                    } catch (e) {
                        retries--;
                        if (retries === 0) throw e;
                        await new Promise(r => setTimeout(r, 1000));
                    }
                }
            }
        };

        // ==========================================
        // 3. Main App Logic
        // ==========================================
        const apiUrl = "https://script.google.com/macros/s/AKfycbxKcWJD1mBa7K7W2tkHul0tDzDnzH7j3R6ZR5s7InAwXqDyqSDL5TI43y2L07Lb0DQB/exec";
        
        let travelData = {};
        let progress = JSON.parse(localStorage.getItem('trip_progress')) || {};

        const guideTitleMap = {
            "大內宿": "ouchijuku",
            "大内宿": "ouchijuku",
            "只見川": "tadami",
            "第一橋樑": "tadami",
            "新潟機場": "niigata-airport",
            "新潟空港": "niigata-airport"
        };

        function getGuideId(title) {
            for (let key in guideTitleMap) {
                if (title.includes(key)) return guideTitleMap[key];
            }
            return null;
        }

        function linkify(text) {
            if (!text) return "";
            let processed = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" class="memo-link">$1</a>');
            const urlRegex = /(?<!href="|">)(https?:\/\/[^\s<]+)/g;
            return processed.replace(urlRegex, '<a href="$1" target="_blank" class="memo-link">$1</a>');
        }

        function formatMultiLines(text) {
            if (!text || text === "undefined") return '尚無筆記';
            const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            return lines.length <= 1 ? linkify(text) : `<ol class="list-decimal ml-5 space-y-2">${lines.map(l => `<li>${linkify(l)}</li>`).join('')}</ol>`;
        }

        function openGoApp() {
            window.location.href = "jp.go.taxiapp://";
            setTimeout(() => { window.location.href = "https://go.mo-t.com/"; }, 1500);
        }

        async function fetchTravelData() {
            try {
                const res = await fetch(apiUrl + "?t=" + Date.now());
                if (!res.ok) throw new Error("Network response was not ok");
                
                const rawData = await res.json();
                
                if (rawData.error) throw new Error(rawData.error);

                travelData = rawData; 

                if (rawData.guides) {
                    console.log("成功載入導遊資料:", Object.keys(rawData.guides));
                    Object.assign(guideDatabase, rawData.guides);
                }

                document.getElementById('loading-screen').style.display = 'none';
                renderSchedule();
                createSnow();
            } catch (e) {
                console.error("同步錯誤:", e);
                document.getElementById('loading-text').innerHTML = "同步失敗<br><span style='font-size:12px;opacity:0.8'>請檢查網址或試算表權限</span>";
            }
        }

        function renderSchedule() {
            if (!travelData.days) return;
            const tabs = document.getElementById('day-tabs');
            const container = document.getElementById('schedule-container');
            tabs.innerHTML = ''; container.innerHTML = '';

            travelData.days.forEach((d, dayIdx) => {
                const btn = document.createElement('button');
                btn.className = `day-btn flex-shrink-0 px-6 py-2 rounded-[1.5rem] flex flex-col items-center bg-white text-slate-400 border border-slate-100 ${dayIdx === 0 ? 'active' : ''}`;
                btn.innerHTML = `<span class="text-sm font-bold opacity-70">Day ${d.day}</span><span class="text-sm font-black">${d.date}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    showDay(d.day);
                };
                tabs.appendChild(btn);

                const div = document.createElement('div');
                div.id = `day-sec-${d.day}`;
                div.className = `day-section ${dayIdx === 0 ? '' : 'hidden'}`;
                
                let html = '';
                d.items.forEach((item, itemIdx) => {
                    const itemId = `d${d.day}i${itemIdx}`;
                    const isDone = progress[itemId];
                    const guideId = getGuideId(item.title); 
                    
                    html += `
                        <div class="glass-card rounded-[2rem] overflow-hidden mb-5 shadow-sm ${isDone ? 'item-completed' : ''}">
                            <div class="img-container">
                                <img src="${item.img}" referrerpolicy="no-referrer" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1483921020237-2ff51e8e4b22?w=800'">
                                <div class="absolute top-3 left-3 bg-white/90 px-4 py-1.5 rounded-full text-sm font-black text-sky-500 shadow-sm">
                                    <i class="far fa-clock mr-1"></i>${item.time}
                                </div>
                                <button onclick="toggleProgress('${itemId}')" class="absolute top-3 right-3 w-10 h-10 rounded-full bg-white/90 shadow-sm flex items-center justify-center">
                                    ${isDone ? '✅' : '○'}
                                </button>
                            </div>
                            <div class="p-5">
                                <h3 class="font-black text-lg text-slate-700 mb-3">${item.title}</h3>
                                
                                <div class="grid grid-cols-2 gap-3 mb-3">
                                    ${ guideId ? 
                                    `<button onclick="guideApp.open('${guideId}')" class="action-btn bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-xl shadow-md active:scale-95 transition">
                                        <i class="fas fa-user-tie mr-2"></i>私人導遊
                                    </button>` : 
                                    `<button disabled class="action-btn bg-slate-100 text-slate-300 rounded-xl cursor-not-allowed">
                                        無導覽
                                    </button>`
                                    }
                                    <button onclick="openMemoByIndex(${dayIdx}, ${itemIdx})" class="action-btn bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200">
                                        查看筆記
                                    </button>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <button onclick="openGoApp()" class="action-btn bg-black text-white rounded-xl">
                                        GO 叫車
                                    </button>
                                    <a href="${item.map}" target="_blank" class="action-btn bg-sky-400 text-white rounded-xl shadow-sm hover:bg-sky-500">
                                        開啟導航
                                    </a>
                                </div>
                            </div>
                        </div>`;
                });
                div.innerHTML = html;
                container.appendChild(div);
            });
        }

        function openMemoByIndex(dayIdx, itemIdx) {
            const item = travelData.days[dayIdx].items[itemIdx];
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-memo-content').innerHTML = formatMultiLines(item.memo);
            document.getElementById('memo-modal').classList.replace('hidden', 'flex');
        }

        function showDay(d) {
            document.querySelectorAll('.day-section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`day-sec-${d}`).classList.remove('hidden');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById('btn-schedule').className = tab === 'schedule' ? 'text-sky-400' : 'text-slate-300';
            document.getElementById('btn-expenses').className = tab === 'expenses' ? 'text-sky-400' : 'text-slate-300';
        }

        function closeMemo() { 
            document.getElementById('memo-modal').classList.replace('flex', 'hidden'); 
        }

        function createSnow() {
            const container = document.getElementById('snow-container');
            for (let i = 0; i < 20; i++) {
                const snow = document.createElement('div');
                snow.innerHTML = '❄'; snow.className = 'snowflake';
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.animationDuration = Math.random() * 3 + 2 + 's';
                container.appendChild(snow);
            }
        }

        function toggleProgress(itemId) {
            progress[itemId] = !progress[itemId];
            localStorage.setItem('trip_progress', JSON.stringify(progress));
            renderSchedule();
        }

        window.onload = () => fetchTravelData();
    </script>
</body>
</html>
