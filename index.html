<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>冬季只見線之旅 ❄️</title>
    
    <link rel="manifest" href="manifest.json?v=17">
    <meta name="theme-color" content="#38bdf8">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2334/2334855.png?v=17">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* 主程式樣式 */
        body { font-family: 'Zen Maru Gothic', sans-serif; background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 100%); color: #475569; overflow-x: hidden; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .snowflake { position: fixed; top: -10px; color: white; z-index: 0; animation: fall linear infinite; pointer-events: none; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.6); transition: all 0.3s; }
        .day-btn.active { background-color: #38bdf8; color: white; transform: scale(1.05); box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); }
        #loading-screen { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .img-container { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #e2e8f0; }
        .item-completed { opacity: 0.6; filter: grayscale(0.4); transform: scale(0.98); }
        .memo-link { color: #38bdf8; text-decoration: underline; font-weight: bold; }
        .action-btn { font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; height: 42px; }

        /* 通用導遊模式樣式 */
        #guide-overlay { font-family: 'Noto Sans TC', sans-serif; }
        .guide-fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .spinner {
            border: 3px solid rgba(140, 123, 117, 0.3); border-radius: 50%; border-top: 3px solid var(--guide-color, #8c7b75);
            width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .img-box {
            background: #eee; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            color: #888; font-size: 0.9rem; overflow: hidden; border: 1px solid #ddd;
            font-weight: bold; background-color: #f3f4f6; text-align: center;
        }
        /* 動態主題色變數 */
        :root { --guide-color: #8c7b75; }
        
        /* 聊天室樣式優化 */
        .chat-bubble { max-width: 85%; padding: 12px 16px; border-radius: 1rem; line-height: 1.6; font-size: 0.95rem; margin-bottom: 12px; position: relative; }
        .chat-user { background-color: #3b82f6; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .chat-ai { background-color: #f3f4f6; color: #374151; margin-right: auto; border-bottom-left-radius: 4px; border: 1px solid #e5e7eb; }
    </style>
</head>
<body class="pb-24">

    <div id="loading-screen">
        <div class="text-sky-400 text-6xl mb-4 animate-spin"><i class="fas fa-snowflake"></i></div>
        <p id="loading-text" class="text-sky-500 font-bold">同步資料中...</p>
    </div>

    <div id="snow-container"></div>

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 px-6 py-4 rounded-b-[2rem] shadow-sm border-b border-blue-50">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-black text-sky-500 tracking-wider">冬季只見線之旅 ☃️</h1>
            <div class="bg-blue-50 text-sky-400 w-10 h-10 rounded-full flex items-center justify-center shadow-inner overflow-hidden">
                <img src="https://cdn-icons-png.flaticon.com/512/2334/2334855.png" class="w-7 h-7 object-contain">
            </div>
        </div>
    </header>

    <main id="app-content">
        <section id="tab-schedule" class="tab-content">
            <nav id="day-tabs" class="flex overflow-x-auto p-4 gap-3 sticky top-[85px] z-30 hide-scroll"></nav>
            <div id="schedule-container" class="px-4 pb-4 space-y-5"></div>
        </section>

        <section id="tab-expenses" class="tab-content hidden px-5 py-6">
            <div class="bg-gradient-to-r from-sky-400 to-blue-400 rounded-[2rem] p-6 shadow-lg text-white text-center mb-8">
                <p class="text-blue-100 text-sm font-bold mb-1">公積金預算</p>
                <h2 id="total-expense" class="text-4xl font-black">¥ 0</h2>
            </div>
        </section>
    </main>

    <div id="memo-modal" class="fixed inset-0 bg-slate-900/40 z-[100] hidden items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 relative">
            <h3 id="modal-title" class="text-2xl font-black text-slate-700 mb-4 border-b pb-2"></h3>
            <div id="modal-memo-content" class="bg-slate-50 rounded-2xl p-4 text-sm text-slate-600 leading-7 max-h-60 overflow-y-auto"></div>
            <button onclick="closeMemo()" class="mt-6 w-full bg-slate-800 text-white py-4 rounded-2xl font-bold action-btn text-lg">關閉</button>
        </div>
    </div>

    <footer class="fixed bottom-6 left-6 right-6 h-16 bg-white/90 backdrop-blur-md rounded-full shadow-2xl flex justify-around items-center z-40 border border-white/50">
        <button onclick="switchTab('schedule')" id="btn-schedule" class="text-sky-400"><i class="fas fa-map text-xl"></i></button>
        <button onclick="switchTab('expenses')" id="btn-expenses" class="text-slate-300"><i class="fas fa-yen-sign text-xl"></i></button>
    </footer>

    <div id="guide-overlay" class="fixed inset-0 bg-white z-[200] hidden flex-col overflow-hidden">
        
        <header class="bg-white/90 backdrop-blur shadow-sm p-4 flex justify-between items-center z-10 shrink-0 border-b">
            <div>
                <h1 id="guide-top-title" class="text-lg font-bold text-gray-800">🏮 私人導遊</h1>
                <p id="guide-top-subtitle" class="text-xs text-gray-500">探索景點故事</p>
            </div>
            <button onclick="guideApp.close()" class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 font-bold hover:bg-gray-200 transition">
                <i class="fas fa-times"></i>
            </button>
        </header>

        <main id="guide-scroll-container" class="flex-1 overflow-y-auto bg-[#f8fafc] pb-20">
            <div class="relative h-64 w-full">
                <div id="guide-hero-img-container" class="w-full h-full bg-gray-200"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent flex flex-col justify-end p-6 text-white">
                    <h2 id="guide-hero-title" class="text-3xl font-bold mb-1"></h2>
                    <p id="guide-hero-desc" class="text-sm opacity-90 line-clamp-2"></p>
                </div>
            </div>

            <div class="p-5 space-y-8 max-w-3xl mx-auto">
                
                <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 guide-fade-in">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2 border-l-4 border-[var(--guide-color)] pl-3">
                        <i class="fas fa-book-open text-[var(--guide-color)]"></i> 文化與歷史景點解說
                    </h3>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="guideApp.askGemini('culture')" class="bg-indigo-50 p-4 rounded-xl text-center hover:bg-indigo-100 active:scale-95 transition border border-indigo-100 group">
                            <div class="w-10 h-10 bg-indigo-200 text-indigo-700 rounded-full flex items-center justify-center mx-auto mb-2 text-xl">✨</div>
                            <span class="font-bold text-gray-700 text-sm block">文化解說</span>
                        </button>
                        <button onclick="guideApp.askGemini('history')" class="bg-orange-50 p-4 rounded-xl text-center hover:bg-orange-100 active:scale-95 transition border border-orange-100 group">
                            <div class="w-10 h-10 bg-orange-200 text-orange-700 rounded-full flex items-center justify-center mx-auto mb-2 text-xl">🏯</div>
                            <span class="font-bold text-gray-700 text-sm block">歷史景點</span>
                        </button>
                    </div>
                    <div id="guide-info-response" class="mt-4 hidden">
                        <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 text-sm leading-relaxed text-gray-700"></div>
                    </div>
                </section>

                <section id="guide-food-section" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 guide-fade-in">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2 border-l-4 border-[var(--guide-color)] pl-3">
                        <i class="fas fa-utensils text-[var(--guide-color)]"></i> 當地美食
                    </h3>
                    <div id="food-list" class="space-y-4"></div>
                </section>

                <section class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden guide-fade-in flex flex-col h-[500px]">
                    <div class="p-4 border-b bg-gray-50 flex items-center justify-between">
                        <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                            <i class="fas fa-robot text-indigo-500"></i> 旅遊管家
                        </h3>
                        <span class="text-xs bg-indigo-100 text-indigo-600 px-2 py-1 rounded-full font-bold">線上</span>
                    </div>
                    
                    <div id="chat-history" class="flex-1 overflow-y-auto p-4 bg-slate-50/50">
                        <div class="chat-bubble chat-ai">
                            您好！我是您的專屬旅遊管家。關於這裡的任何問題，歡迎隨時問我！
                        </div>
                    </div>

                    <div class="p-3 border-t bg-white flex gap-2">
                        <input id="chat-input" type="text" placeholder="問問旅遊管家..." class="flex-1 border border-gray-200 bg-gray-50 focus:bg-white focus:border-indigo-400 px-4 py-3 rounded-xl outline-none transition text-sm">
                        <button onclick="guideApp.handleChat()" class="bg-indigo-600 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-md active:scale-95 transition">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </section>

                <div class="text-center text-xs text-gray-400 pb-4">Powered by Gemini ✨</div>
            </div>
        </main>
    </div>

    <div id="ai-modal" onclick="if(event.target === this) guideApp.closeModal()" class="fixed inset-0 bg-black bg-opacity-50 hidden z-[250] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl max-w-md w-full max-h-[80vh] flex flex-col shadow-2xl overflow-hidden animate-[fadeIn_0.2s_ease-out]">
            <div class="flex justify-between items-center p-4 border-b bg-gray-50">
                <h3 id="ai-modal-title" class="font-bold text-gray-800">旅遊管家建議</h3>
                <button onclick="guideApp.closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 text-gray-500">&times;</button>
            </div>
            <div id="ai-modal-body" class="p-5 overflow-y-auto text-sm leading-relaxed text-gray-700"></div>
        </div>
    </div>


    <script>
        // ==========================================
        // 1. Guide Database
        // ==========================================
        const guideDatabase = {};

        // ==========================================
        // 2. Guide App Logic (單頁式改版)
        // ==========================================
        
        // ⚠️ API Key
        const apiKey = "AIzaSyCsTckKweWtDj0g88fEiI32UFuBiAsRmWM"; 

        const guideApp = {
            state: { currentId: null },

            open: function(guideId) {
                const data = guideDatabase[guideId];
                if (!data) { 
                    alert("⚠️ 錯誤：找不到 ID 為 [" + guideId + "] 的導覽資料。\n\n請檢查 Google 試算表設定。"); 
                    return; 
                }
                this.state.currentId = guideId;
                
                // 設定 CSS 變數
                document.documentElement.style.setProperty('--guide-color', data.themeColor);

                // 填充頂部資訊
                document.getElementById('guide-top-title').innerText = "🏮 " + data.title;
                document.getElementById('guide-hero-title').innerText = data.title;
                document.getElementById('guide-hero-desc').innerText = data.overview.desc;
                
                // 處理主圖 (加入防擋 Referrer)
                const imgContainer = document.getElementById('guide-hero-img-container');
                imgContainer.innerHTML = `<img src="${data.overview.img}" referrerpolicy="no-referrer" class="w-full h-full object-cover">`;

                // 填充美食列表
                this.renderFood(data.food.items || [], data.title);

                // 重置聊天室與解說區
                document.getElementById('chat-history').innerHTML = `
                    <div class="chat-bubble chat-ai">
                        您好！我是您的${data.title}專屬旅遊管家。關於這裡的任何問題，歡迎隨時問我！
                    </div>`;
                document.getElementById('guide-info-response').classList.add('hidden');
                document.getElementById('guide-info-response').querySelector('div').innerText = '';

                // 顯示介面
                const overlay = document.getElementById('guide-overlay');
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            },

            close: function() {
                const overlay = document.getElementById('guide-overlay');
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            },

            // 渲染美食區塊
            renderFood: function(items, locationTitle) {
                const container = document.getElementById('food-list');
                container.innerHTML = '';
                
                if (items.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">尚無美食資料</p>';
                    return;
                }

                items.forEach(item => {
                    const foodPrompt = `請介紹「${locationTitle}」的特色美食：「${item.name}」。由來、口感與推薦吃法。`;
                    
                    // 檢查圖片連結並加入 referrerpolicy
                    let imgHtml = item.img;
                    if (item.img.startsWith('http')) {
                        imgHtml = `<img src="${item.img}" referrerpolicy="no-referrer" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">`;
                    }

                    const html = `
                        <div class="flex gap-4 p-3 rounded-xl bg-gray-50 border border-gray-100 hover:bg-gray-100 transition group cursor-pointer" onclick="guideApp.askGeminiFood('${foodPrompt}', '${item.name}')">
                            <div class="w-24 h-24 shrink-0 rounded-lg overflow-hidden bg-gray-200 shadow-sm relative">
                                ${imgHtml}
                                <div class="absolute bottom-0 right-0 bg-white/90 px-1.5 py-0.5 rounded-tl-lg text-xs font-bold text-gray-500">
                                    <i class="fas fa-search"></i>
                                </div>
                            </div>
                            <div class="flex-1 flex flex-col justify-center">
                                <h4 class="font-bold text-gray-800 text-lg mb-1 group-hover:text-[var(--guide-color)] transition">${item.name}</h4>
                                <p class="text-xs text-gray-500 line-clamp-2 leading-relaxed">${item.desc}</p>
                                <span class="text-xs text-indigo-500 font-bold mt-2 flex items-center gap-1">
                                    <i class="fas fa-comment-dots"></i> 點擊詢問管家
                                </span>
                            </div>
                        </div>`;
                    container.innerHTML += html;
                });
            },

            // 針對文化/歷史按鈕的處理 (顯示在按鈕下方)
            askGemini: async function(type) {
                const data = guideDatabase[this.state.currentId];
                let prompt = "";
                let title = "";

                if (type === 'culture') {
                    prompt = `請詳細導覽「${data.title}」的背景故事與文化特色，並說明為什麼這裡值得一遊。`;
                    title = "文化解說";
                } else {
                    prompt = `請專注介紹「${data.title}」的歷史淵源、過去發生的重要事件，以及這些歷史如何影響現在的樣貌。`;
                    title = "歷史景點";
                }

                const responseArea = document.getElementById('guide-info-response');
                const contentDiv = responseArea.querySelector('div');
                
                responseArea.classList.remove('hidden');
                contentDiv.innerHTML = `<div class="flex items-center gap-2 text-gray-500"><div class="spinner"></div> 旅遊管家正在查詢${title}...</div>`;

                try {
                    const systemPrompt = data.aiPersona || "你是一位貼心的旅遊隨行管家。";
                    const text = await this.fetchGemini(prompt, systemPrompt);
                    contentDiv.innerHTML = `<h4 class="font-bold text-[var(--guide-color)] mb-2">🏮 ${title}</h4>${text}`;
                } catch (e) {
                    contentDiv.innerHTML = `<span class="text-red-500">連線失敗，請檢查網路。</span>`;
                }
            },

            // 針對美食的處理 (顯示在 Modal)
            askGeminiFood: async function(prompt, foodName) {
                const modal = document.getElementById('ai-modal');
                const body = document.getElementById('ai-modal-body');
                const title = document.getElementById('ai-modal-title');
                
                title.innerText = "美食介紹：" + foodName;
                modal.classList.remove('hidden');
                body.innerHTML = '<div class="text-center p-8 text-gray-500"><div class="spinner mr-2"></div> 正在準備美食故事...</div>';

                try {
                    const data = guideDatabase[this.state.currentId];
                    const systemPrompt = data.aiPersona || "你是一位美食評論家與導遊。";
                    const text = await this.fetchGemini(prompt, systemPrompt);
                    body.innerHTML = text;
                } catch (e) {
                    body.innerHTML = `<div class="text-center text-red-500 p-4">暫時無法回應，請稍後再試。</div>`;
                }
            },

            closeModal: function() {
                document.getElementById('ai-modal').classList.add('hidden');
            },

            // 聊天室功能
            handleChat: async function() {
                const input = document.getElementById('chat-input');
                const history = document.getElementById('chat-history');
                const text = input.value.trim();
                if (!text) return;

                // 1. 顯示使用者訊息
                history.innerHTML += `<div class="chat-bubble chat-user">${text}</div>`;
                input.value = "";
                history.scrollTop = history.scrollHeight;

                // 2. 顯示 Loading
                const loadingId = 'ai-loading-' + Date.now();
                history.innerHTML += `<div id="${loadingId}" class="chat-bubble chat-ai flex items-center gap-2"><div class="spinner"></div> 思考中...</div>`;
                history.scrollTop = history.scrollHeight;

                try {
                    const data = guideDatabase[this.state.currentId];
                    const systemPrompt = data.aiPersona || "你是一位貼心的旅遊隨行管家。";
                    const response = await this.fetchGemini(text, systemPrompt);
                    document.getElementById(loadingId).innerHTML = response;
                } catch (error) {
                    document.getElementById(loadingId).innerText = "旅遊管家暫時忙線中 (請檢查網路或 Key)";
                }
                history.scrollTop = history.scrollHeight;
            },

            fetchGemini: async function(userPrompt, systemPrompt) {
                if (!apiKey) return "請填寫 API Key";
                
                let retries = 2;
                const payload = {
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                while (retries > 0) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error('API Error');
                        const data = await response.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text || "No content";
                    } catch (e) {
                        retries--;
                        if (retries === 0) throw e;
                        await new Promise(r => setTimeout(r, 1000));
                    }
                }
            }
        };

        // ==========================================
        // 3. Main App Logic
        // ==========================================
        // ⚠️ 更新後的 GAS 網址
        const apiUrl = "https://script.google.com/macros/s/AKfycbxMXJXHZQC1lWQDEBWxk9yDk6v24EyTKm5wwh5lkR9zMH19Tw7HLteoIddLlYlGHPoQWg/exec";
        
        let travelData = {};
        let progress = JSON.parse(localStorage.getItem('trip_progress')) || {};

        const guideTitleMap = {
            "大內宿": "ouchijuku",
            "大内宿": "ouchijuku",
            "只見川": "tadami",
            "第一橋樑": "tadami",
            "新潟機場": "niigata-airport",
            "新潟空港": "niigata-airport"
        };

        function getGuideId(title) {
            for (let key in guideTitleMap) {
                if (title.includes(key)) return guideTitleMap[key];
            }
            return null;
        }

        function linkify(text) {
            if (!text) return "";
            let processed = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" class="memo-link">$1</a>');
            const urlRegex = /(?<!href="|">)(https?:\/\/[^\s<]+)/g;
            return processed.replace(urlRegex, '<a href="$1" target="_blank" class="memo-link">$1</a>');
        }

        function formatMultiLines(text) {
            if (!text || text === "undefined") return '尚無筆記';
            const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            return lines.length <= 1 ? linkify(text) : `<ol class="list-decimal ml-5 space-y-2">${lines.map(l => `<li>${linkify(l)}</li>`).join('')}</ol>`;
        }

        function openGoApp() {
            window.location.href = "jp.go.taxiapp://";
            setTimeout(() => { window.location.href = "https://go.mo-t.com/"; }, 1500);
        }

        async function fetchTravelData() {
            try {
                const res = await fetch(apiUrl + "?t=" + Date.now());
                if (!res.ok) throw new Error("Network response was not ok");
                
                const rawData = await res.json();
                
                if (rawData.error) throw new Error(rawData.error);

                travelData = rawData; 

                if (rawData.guides) {
                    console.log("成功載入導遊資料:", Object.keys(rawData.guides));
                    Object.assign(guideDatabase, rawData.guides);
                }

                document.getElementById('loading-screen').style.display = 'none';
                renderSchedule();
                createSnow();
            } catch (e) {
                console.error("同步錯誤:", e);
                document.getElementById('loading-text').innerHTML = "同步失敗<br><span style='font-size:12px;opacity:0.8'>請檢查網址或試算表權限</span>";
            }
        }

        function renderSchedule() {
            if (!travelData.days) return;
            const tabs = document.getElementById('day-tabs');
            const container = document.getElementById('schedule-container');
            tabs.innerHTML = ''; container.innerHTML = '';

            travelData.days.forEach((d, dayIdx) => {
                const btn = document.createElement('button');
                btn.className = `day-btn flex-shrink-0 px-6 py-2 rounded-[1.5rem] flex flex-col items-center bg-white text-slate-400 border border-slate-100 ${dayIdx === 0 ? 'active' : ''}`;
                btn.innerHTML = `<span class="text-sm font-bold opacity-70">Day ${d.day}</span><span class="text-sm font-black">${d.date}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    showDay(d.day);
                };
                tabs.appendChild(btn);

                const div = document.createElement('div');
                div.id = `day-sec-${d.day}`;
                div.className = `day-section ${dayIdx === 0 ? '' : 'hidden'}`;
                
                let html = '';
                d.items.forEach((item, itemIdx) => {
                    const itemId = `d${d.day}i${itemIdx}`;
                    const isDone = progress[itemId];
                    const guideId = getGuideId(item.title); 
                    
                    html += `
                        <div class="glass-card rounded-[2rem] overflow-hidden mb-5 shadow-sm ${isDone ? 'item-completed' : ''}">
                            <div class="img-container">
                                <img src="${item.img}" referrerpolicy="no-referrer" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1483921020237-2ff51e8e4b22?w=800'">
                                <div class="absolute top-3 left-3 bg-white/90 px-4 py-1.5 rounded-full text-sm font-black text-sky-500 shadow-sm">
                                    <i class="far fa-clock mr-1"></i>${item.time}
                                </div>
                                <button onclick="toggleProgress('${itemId}')" class="absolute top-3 right-3 w-10 h-10 rounded-full bg-white/90 shadow-sm flex items-center justify-center">
                                    ${isDone ? '✅' : '○'}
                                </button>
                            </div>
                            <div class="p-5">
                                <h3 class="font-black text-lg text-slate-700 mb-3">${item.title}</h3>
                                
                                <div class="grid grid-cols-2 gap-3 mb-3">
                                    ${ guideId ? 
                                    `<button onclick="guideApp.open('${guideId}')" class="action-btn bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-xl shadow-md active:scale-95 transition">
                                        <i class="fas fa-user-tie mr-2"></i>私人導遊
                                    </button>` : 
                                    `<button disabled class="action-btn bg-slate-100 text-slate-300 rounded-xl cursor-not-allowed">
                                        無導覽
                                    </button>`
                                    }
                                    <button onclick="openMemoByIndex(${dayIdx}, ${itemIdx})" class="action-btn bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200">
                                        查看筆記
                                    </button>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <button onclick="openGoApp()" class="action-btn bg-black text-white rounded-xl">
                                        GO 叫車
                                    </button>
                                    <a href="${item.map}" target="_blank" class="action-btn bg-sky-400 text-white rounded-xl shadow-sm hover:bg-sky-500">
                                        開啟導航
                                    </a>
                                </div>
                            </div>
                        </div>`;
                });
                div.innerHTML = html;
                container.appendChild(div);
            });
        }

        function openMemoByIndex(dayIdx, itemIdx) {
            const item = travelData.days[dayIdx].items[itemIdx];
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-memo-content').innerHTML = formatMultiLines(item.memo);
            document.getElementById('memo-modal').classList.replace('hidden', 'flex');
        }

        function showDay(d) {
            document.querySelectorAll('.day-section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`day-sec-${d}`).classList.remove('hidden');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById('btn-schedule').className = tab === 'schedule' ? 'text-sky-400' : 'text-slate-300';
            document.getElementById('btn-expenses').className = tab === 'expenses' ? 'text-sky-400' : 'text-slate-300';
        }

        function closeMemo() { 
            document.getElementById('memo-modal').classList.replace('flex', 'hidden'); 
        }

        function createSnow() {
            const container = document.getElementById('snow-container');
            for (let i = 0; i < 20; i++) {
                const snow = document.createElement('div');
                snow.innerHTML = '❄'; snow.className = 'snowflake';
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.animationDuration = Math.random() * 3 + 2 + 's';
                container.appendChild(snow);
            }
        }

        function toggleProgress(itemId) {
            progress[itemId] = !progress[itemId];
            localStorage.setItem('trip_progress', JSON.stringify(progress));
            renderSchedule();
        }

        window.onload = () => fetchTravelData();
    </script>
</body>
</html>
